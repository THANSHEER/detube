<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Icon (72×72) -->
  <rect width="72" height="72" rx="16" fill="url(#bg)"/>
  <!-- D outer silhouette -->
  <path fill="white" d="M 10,10 L 40,10 C 65,10 65,62 40,62 L 10,62 Z"/>
  <!-- Inner cutout -->
  <path fill="url(#bg)" d="M 20,20 L 39,20 C 55,20 55,52 39,52 L 20,52 Z"/>
  <!-- Play triangle -->
  <polygon fill="white" points="27,27 51,36 27,45"/>

  <!-- Wordmark: "De" in dark + "tube" in indigo -->
  <text x="84" y="49"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="34"
        letter-spacing="-0.5">
    <tspan fill="#1a1a2e">De</tspan><tspan fill="#6366f1">tube</tspan>
  </text>
</svg>
