<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2828"/>
      <stop offset="100%" stop-color="#B80000"/>
    </linearGradient>
  </defs>

  <!-- Icon badge (72×72) -->
  <rect width="72" height="72" rx="15" fill="url(#bg)"/>

  <!-- Control slider 1 (top) -->
  <rect x="13" y="19" width="46" height="3" rx="1.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="13" y="19" width="32" height="3" rx="1.5" fill="white"/>
  <circle cx="45" cy="20.5" r="5.5" fill="white"/>

  <!-- Control slider 2 (middle) -->
  <rect x="13" y="35" width="46" height="3" rx="1.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="13" y="35" width="13" height="3" rx="1.5" fill="white"/>
  <circle cx="26" cy="36.5" r="5.5" fill="white"/>

  <!-- Control slider 3 (bottom) -->
  <rect x="13" y="51" width="46" height="3" rx="1.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="13" y="51" width="24" height="3" rx="1.5" fill="white"/>
  <circle cx="37" cy="52.5" r="5.5" fill="white"/>

  <!-- Wordmark -->
  <text x="84" y="49"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="34"
        letter-spacing="-0.5">
    <tspan fill="#0f0f0f">De</tspan><tspan fill="#CC0000">tube</tspan>
  </text>
</svg>
