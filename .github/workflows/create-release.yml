name: Create Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'metadata.json'
      - 'CHANGELOG.md'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get current version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./metadata.json').version")
          fi

          # Validate version format (semantic versioning)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION (expected: x.y.z)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Current version: $VERSION"

      - name: Check if GitHub Release exists
        id: check_release
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          # Check if GitHub Release exists (not just local tag)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Release $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📦 Release $TAG does not exist, will create it"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: node scripts/build-css.js

      - name: Build extension for all browsers
        run: |
          for browser in chrome firefox edge safari opera; do
            TARGET_BROWSER=$browser node node_modules/.bin/vite build
          done

      - name: Package extension zips and generate SHA-256 checksums
        run: node scripts/zip-builds.js

      - name: Extract release title and notes from changelog
        if: steps.check_release.outputs.exists == 'false'
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract changelog header line for this version
          TITLE=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver {
              sub(/^## /, "");
              print;
              exit;
            }
          ' CHANGELOG.md)

          # Ensure release number is wrapped in brackets: [x.y.z]
          if [[ "$TITLE" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TITLE="[${VERSION}]${TITLE#"${VERSION}"}"
          elif [ -z "$TITLE" ]; then
            TITLE="[${VERSION}] - $(date +'%Y-%m-%d')"
          fi

          # Extract changelog body section for this version
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver {flag=1; next}
            flag && (/^## \[/ || /^## [0-9]/ || /^\[/) {exit}
            flag {print}
          ' CHANGELOG.md | sed -e '/./,$!d')

          # Validate that changelog section is not empty
          if [ -z "$NOTES" ]; then
            echo "❌ No changelog entry found for version $VERSION"
            exit 1
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "✅ Release title extracted: $TITLE"

          # Use multiline delimiter syntax for GITHUB_OUTPUT
          EOF=$(od -An -tx1 -N8 /dev/urandom | tr -d ' ')
          echo "notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
          echo "✅ Release notes extracted successfully"

      - name: Create GitHub Release with Assets
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create \
            "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.release_notes.outputs.title }}" \
            --notes "${{ steps.release_notes.outputs.notes }}" \
            --latest \
            "detube-${{ steps.version.outputs.version }}.zip" \
            "detube-${{ steps.version.outputs.version }}.zip.sha256"
          echo "✅ Release ${{ steps.version.outputs.tag }} with title '${{ steps.release_notes.outputs.title }}' created successfully"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Update assets for existing release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          gh release upload \
            "${{ steps.version.outputs.tag }}" \
            "detube-${{ steps.version.outputs.version }}.zip" \
            "detube-${{ steps.version.outputs.version }}.zip.sha256" \
            --clobber
          echo "✅ Updated release assets and SHA-256 checksums for ${{ steps.version.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
