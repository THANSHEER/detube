name: Create Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.*.json'
      - 'CHANGELOG.md'

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep '"version"' manifest.chrome.json | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        if: steps.check_release.outputs.exists == 'false'
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract changelog section for this version
          NOTES=$(awk "/## \[${VERSION}\]/,/## \[/{
            if (/## \[${VERSION}\]/) {start=1; next}
            if (/## \[/ && start) exit
            if (start) print
          }" CHANGELOG.md | sed '/^$/d' | sed '$ d')

          # Handle multiline output
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: ${{ steps.version.outputs.tag }} - DeTube Extension
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

      - name: Release already exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "✅ Release ${{ steps.version.outputs.tag }} already exists, skipping creation"
